<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monchhichi Photo Booth</title>

    <!-- ใช้ Google Fonts เป็น Fallback ในกรณีที่ยังไม่มีไฟล์ฟอนต์จริง -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme Colors */
            --bg-margin: #ffd3e0;       /* ขอบสีชมพูรอบเว็บ */
            --bg-desk: #fff5f7;         /* พื้นหลังโต๊ะสีครีมชมพูอ่อนๆ */
            --booth-border: #ffffff;    /* สีกรอบ Photo Booth */
            --pad-pink: #f48fb1;        /* สี Padding แผ่นแรก (ชมพูเข้ม) */
            --pad-blue: #e3f2fd;        /* สี Padding แผ่นที่สอง */
            --paper-color: #fffdf2;     /* สีกระดาษลับ */
            --text-color: #5c4044;      /* สีข้อความวินเทจ */
            --shadow-color: rgba(168, 123, 134, 0.25);
            
            /* 
             * Responsive Scaling Variable 
             * สร้างตัวคูณ (Multiplier) ที่อิงจากขนาดหน้าจอ (vmin)
             * เพื่อให้ย่อส่วนทุกอย่างลงตามสัดส่วนเดิม 100% โดยไม่จัดเรียง Layout ใหม่
             * กำหนด Max Cap ไว้ที่ 1px เพื่อไม่ให้ใหญ่เกินไปบนหน้าจอ Desktop ขนาดใหญ่
             */
            --u: min(0.09vmin, 1px);
        }

        /* รีเซ็ตค่าเริ่มต้น */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-margin);
            display: flex;
            justify-content: center;
            align-items: center;
            /* ป้องกันการคลุมดำและลากรูป */
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ฟอนต์ตาม Requirement */
        @font-face {
            font-family: 'PG Jam Rolls';
            src: local('PG Jam Rolls');
        }
        @font-face {
            font-family: 'LMF Wanangkhan';
            src: local('LMF Wanangkhan');
        }

        .font-jamrolls {
            font-family: 'PG Jam Rolls', 'Itim', cursive;
        }
        
        .font-wanangkhan {
            font-family: 'LMF Wanangkhan', 'Mali', cursive;
        }

        /* โต๊ะจำลอง (Scene) ที่รักษาสัดส่วน */
        .scene {
            width: 95vw;
            height: 95vh;
            background-color: var(--bg-desk);
            background-image: 
                radial-gradient(circle at 100% 100%, #ffedf2 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, #ffedf2 0%, transparent 50%);
            border-radius: calc(20 * var(--u));
            box-shadow: inset 0 0 calc(40 * var(--u)) rgba(255, 255, 255, 0.5),
                        0 calc(20 * var(--u)) calc(50 * var(--u)) rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: calc(60 * var(--u)); /* ระยะห่างระหว่างแผ่น (สเกลตามหน้าจอ) */
            overflow: hidden;
            /* บังคับเรียงแนวนอน (Row) เสมอ ไม่ว่าอุปกรณ์ใด */
            flex-direction: row;
        }

        /* กรอบหลักของ Photo Booth แต่ละแผ่น */
        .booth-wrapper {
            position: relative;
            width: calc(300 * var(--u)); /* ขนาดสเกลแทน clamp แบบเก่า */
            z-index: 2;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* แผ่นที่ 1 เอียงซ้ายนิดๆ */
        .strip-1-wrap {
            transform: rotate(-3deg) translateY(calc(10 * var(--u)));
            animation: float 6s ease-in-out infinite;
        }

        /* แผ่นที่ 2 เอียงขวานิดๆ */
        .strip-2-wrap {
            transform: rotate(4deg) translateY(calc(-10 * var(--u)));
            animation: float 7s ease-in-out infinite alternate;
        }

        .booth {
            background-color: var(--booth-border);
            padding: calc(20 * var(--u));
            border-radius: calc(4 * var(--u));
            box-shadow: calc(2 * var(--u)) calc(10 * var(--u)) calc(25 * var(--u)) var(--shadow-color);
            position: relative;
        }

        /* สี Padding ด้านใน */
        .booth.bg-pink { background-color: var(--booth-border); }
        .booth.bg-pink .inner-pad { background-color: var(--pad-pink); }
        
        .booth.bg-blue { background-color: var(--booth-border); }
        .booth.bg-blue .inner-pad { background-color: var(--pad-blue); }

        .inner-pad {
            padding: calc(15 * var(--u));
            border-radius: calc(2 * var(--u));
            display: flex;
            flex-direction: column;
            gap: calc(15 * var(--u));
        }

        /* ช่องใส่รูปภาพแต่ละช่อง */
        .photo-slot {
            width: 100%;
            aspect-ratio: 3 / 4; /* อัตราส่วนรูปถ่ายคงเดิม */
            background-color: #eaeaea; 
            position: relative;
            overflow: hidden;
            border-radius: calc(2 * var(--u));
            box-shadow: inset 0 calc(2 * var(--u)) calc(5 * var(--u)) rgba(0,0,0,0.05);
        }

        .photo-slot img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; 
        }

        .photo-slot img.active {
            opacity: 1;
        }

        /* การตกแต่งสติกเกอร์ (ใช้ % เพื่อให้ขยับสเกลตามกรอบ) */
        .sticker {
            position: absolute;
            z-index: 10;
            filter: drop-shadow(0 calc(4 * var(--u)) calc(6 * var(--u)) rgba(0,0,0,0.15));
            pointer-events: none;
        }

        /* การจัดวางสติกเกอร์ แผ่นที่ 1 (m1-m6) */
        .s-m1 { top: -5%; left: -10%; width: 35%; transform: rotate(-15deg); animation: wiggle 4s infinite; }
        .s-m2 { top: 30%; right: -12%; width: 30%; transform: rotate(10deg); }
        .s-m3 { top: 50%; left: -8%; width: 25%; transform: rotate(-5deg); }
        .s-m4 { bottom: 25%; right: -5%; width: 28%; transform: rotate(20deg); animation: wiggle 5s infinite reverse; }
        .s-m5 { bottom: -6%; left: 10%; width: 32%; transform: rotate(-10deg); }
        .s-m6 { top: 15%; left: -5%; width: 20%; transform: rotate(5deg); }

        /* การจัดวางสติกเกอร์ แผ่นที่ 2 (m7-m12) */
        .s-m7 { top: -8%; right: 10%; width: 38%; transform: rotate(15deg); animation: wiggle 6s infinite; }
        .s-m8 { top: 25%; left: -12%; width: 35%; transform: rotate(-15deg); }
        .s-m9 { top: 45%; right: -8%; width: 25%; transform: rotate(10deg); }
        .s-m10 { bottom: 30%; left: -5%; width: 30%; transform: rotate(-20deg); }
        .s-m11 { bottom: -5%; right: 5%; width: 35%; transform: rotate(8deg); animation: wiggle 4s infinite alternate; }
        .s-m12 { top: 65%; left: -10%; width: 22%; transform: rotate(-8deg); }

        /* ส่วนของกระดาษโน้ตลับ */
        .secret-group {
            position: relative;
            perspective: calc(1000 * var(--u)); 
        }

        .secret-paper {
            position: absolute;
            top: 10%;
            right: -10%;
            left: auto;
            width: calc(320 * var(--u));
            aspect-ratio: 1 / 1;
            background-color: var(--paper-color);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            border-radius: calc(5 * var(--u));
            box-shadow: calc(2 * var(--u)) calc(5 * var(--u)) calc(15 * var(--u)) var(--shadow-color);
            z-index: 1;
            padding: calc(20 * var(--u));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            /* สถานะเริ่มต้น */
            transform: translateZ(calc(-50 * var(--u))) translateX(calc(40 * var(--u))) rotate(8deg); 
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        /* ติ่งกระดาษที่โผล่ออกมาให้กด */
        .secret-hint {
            position: absolute;
            top: 40%;
            right: calc(-35 * var(--u));
            left: auto;
            background: #fff;
            padding: calc(5 * var(--u)) calc(10 * var(--u));
            border-radius: calc(5 * var(--u));
            font-size: calc(16 * var(--u));
            color: #d88fa0;
            box-shadow: 0 calc(2 * var(--u)) calc(5 * var(--u)) rgba(0,0,0,0.1);
            animation: bounce-hint 2s infinite;
            pointer-events: none;
            transform: rotate(90deg);
            transform-origin: center center;
        }

        .paper-msg {
            font-size: calc(40 * var(--u));
            color: var(--text-color);
            margin-bottom: calc(20 * var(--u));
        }

        .paper-date {
            position: absolute;
            bottom: calc(15 * var(--u));
            right: calc(20 * var(--u));
            font-size: calc(18 * var(--u));
            color: #9c7b82;
            text-align: right;
            line-height: 1.4;
        }
        
        .paper-sticker {
            position: absolute;
            top: 10%;
            right: 10%;
            width: 30%;
            transform: rotate(15deg);
            pointer-events: none;
            filter: drop-shadow(0 calc(2 * var(--u)) calc(4 * var(--u)) rgba(0,0,0,0.1));
        }

        /* สถานะเมื่อกดดูกระดาษ */
        .secret-group.active .strip-2-wrap {
            transform: translateZ(calc(-100 * var(--u))) translateY(calc(40 * var(--u))) translateX(calc(-100 * var(--u))) rotate(-5deg) scale(0.9);
            opacity: 0.8;
            pointer-events: none;
        }

        .secret-group.active .secret-paper {
            transform: translateZ(calc(50 * var(--u))) translateY(calc(-20 * var(--u))) translateX(calc(100 * var(--u))) rotate(5deg) scale(1.1);
            z-index: 10;
            box-shadow: 0 calc(30 * var(--u)) calc(60 * var(--u)) rgba(0,0,0,0.15);
        }

        .secret-group.active .secret-hint {
            opacity: 0;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0) rotate(inherit); }
            50% { transform: translateY(calc(-15 * var(--u))) rotate(inherit); }
            100% { transform: translateY(0) rotate(inherit); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }

        @keyframes bounce-hint {
            0%, 100% { transform: rotate(90deg) translateY(0); }
            50% { transform: rotate(90deg) translateY(calc(-8 * var(--u))); }
        }
        
        /* Animation สำหรับ Monchi ตกลงมา */
        .falling-monchi {
            position: fixed;
            top: calc(-150 * var(--u));
            z-index: 100;
            pointer-events: none;
            filter: drop-shadow(0 calc(5 * var(--u)) calc(10 * var(--u)) rgba(0,0,0,0.2));
            animation: fall-down linear infinite;
        }
        
        /* ชุดสติกเกอร์ตกแบบจัดเต็ม เต็มขอบจอ */
        .fm-1 { left: 2%; animation-duration: 14s; animation-delay: 0s; width: calc(90 * var(--u)); }
        .fm-2 { left: 12%; animation-duration: 18s; animation-delay: 4s; width: calc(100 * var(--u)); }
        .fm-3 { left: 22%; animation-duration: 12s; animation-delay: 2s; width: calc(80 * var(--u)); }
        .fm-4 { left: 32%; animation-duration: 20s; animation-delay: 7s; width: calc(110 * var(--u)); }
        .fm-5 { left: 42%; animation-duration: 16s; animation-delay: 1s; width: calc(90 * var(--u)); }
        .fm-6 { left: 52%; animation-duration: 22s; animation-delay: 5s; width: calc(100 * var(--u)); }
        .fm-7 { left: 62%; animation-duration: 15s; animation-delay: 3s; width: calc(95 * var(--u)); }
        .fm-8 { left: 72%; animation-duration: 19s; animation-delay: 6s; width: calc(120 * var(--u)); }
        .fm-9 { left: 82%; animation-duration: 13s; animation-delay: 0s; width: calc(85 * var(--u)); }
        .fm-10 { left: 92%; animation-duration: 17s; animation-delay: 8s; width: calc(105 * var(--u)); }
        .fm-11 { left: 8%; animation-duration: 25s; animation-delay: 10s; width: calc(95 * var(--u)); }
        .fm-12 { left: 28%; animation-duration: 21s; animation-delay: 12s; width: calc(130 * var(--u)); }
        .fm-13 { left: 48%; animation-duration: 14s; animation-delay: 9s; width: calc(90 * var(--u)); }
        .fm-14 { left: 68%; animation-duration: 23s; animation-delay: 11s; width: calc(100 * var(--u)); }
        .fm-15 { left: 88%; animation-duration: 16s; animation-delay: 14s; width: calc(90 * var(--u)); }

        @keyframes fall-down {
            0% { 
                top: calc(-150 * var(--u)); 
                transform: rotate(-20deg);
                opacity: 0;
            }
            5% { opacity: 1; }
            50% { transform: rotate(20deg); }
            95% { opacity: 1; }
            100% { 
                top: 110vh; 
                transform: rotate(-20deg);
                opacity: 0;
            }
        }
        
        .booth-wrapper:hover {
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- สติกเกอร์ Monchi ตกลงมาจากฟ้า (ใส่เยอะๆ เต็มจอ) -->
    <img src="m1.png" class="falling-monchi fm-1" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m2.png" class="falling-monchi fm-2" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m3.png" class="falling-monchi fm-3" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m4.png" class="falling-monchi fm-4" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m5.png" class="falling-monchi fm-5" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m6.png" class="falling-monchi fm-6" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m7.png" class="falling-monchi fm-7" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m8.png" class="falling-monchi fm-8" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m9.png" class="falling-monchi fm-9" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m10.png" class="falling-monchi fm-10" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m11.png" class="falling-monchi fm-11" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m12.png" class="falling-monchi fm-12" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m1.png" class="falling-monchi fm-13" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m5.png" class="falling-monchi fm-14" alt="falling-sticker" onerror="this.style.display='none'">
    <img src="m8.png" class="falling-monchi fm-15" alt="falling-sticker" onerror="this.style.display='none'">

    <div class="scene">
        
        <!-- ================= แผ่นที่ 1 (ชมพู) ================= -->
        <div class="booth-wrapper strip-1-wrap">
            <!-- Stickers -->
            <img src="m1.png" class="sticker s-m1" alt="sticker" onerror="this.style.display='none'">
            <img src="m2.png" class="sticker s-m2" alt="sticker" onerror="this.style.display='none'">
            <img src="m3.png" class="sticker s-m3" alt="sticker" onerror="this.style.display='none'">
            <img src="m4.png" class="sticker s-m4" alt="sticker" onerror="this.style.display='none'">
            <img src="m5.png" class="sticker s-m5" alt="sticker" onerror="this.style.display='none'">
            <img src="m6.png" class="sticker s-m6" alt="sticker" onerror="this.style.display='none'">
            
            <div class="booth bg-pink">
                <div class="inner-pad">
                    <!-- ช่องที่ 1 (รันรูป 1, 7, 13) -->
                    <div class="photo-slot" id="slot-1"></div>
                    <!-- ช่องที่ 2 (รันรูป 2, 8, 14) -->
                    <div class="photo-slot" id="slot-2"></div>
                    <!-- ช่องที่ 3 (รันรูป 3, 9, 15) -->
                    <div class="photo-slot" id="slot-3"></div>
                </div>
            </div>
        </div>

        <!-- ================= แผ่นที่ 2 (ฟ้า) + กระดาษลับ ================= -->
        <div class="secret-group" id="interaction-zone">
            
            <!-- กระดาษลับ (ซ่อนอยู่หลังแผ่น 2) -->
            <div class="secret-paper" id="secret-paper" title="คลิกเพื่ออ่าน">
                <img src="m12.png" class="paper-sticker" alt="sticker" onerror="this.style.display='none'">
                
                <div class="secret-hint font-jamrolls">ดึงออกมาสิอ้วน</div>
                <div class="paper-msg font-wanangkhan">เราคิดถึงแกนะ > &lt;</div>
                <div class="paper-date font-jamrolls">จากน้องแอ๊นท์ ❤️<br>วันที่ 04/08/2026</div>
            </div>

            <div class="booth-wrapper strip-2-wrap">
                <!-- Stickers -->
                <img src="m7.png" class="sticker s-m7" alt="sticker" onerror="this.style.display='none'">
                <img src="m8.png" class="sticker s-m8" alt="sticker" onerror="this.style.display='none'">
                <img src="m9.png" class="sticker s-m9" alt="sticker" onerror="this.style.display='none'">
                <img src="m10.png" class="sticker s-m10" alt="sticker" onerror="this.style.display='none'">
                <img src="m11.png" class="sticker s-m11" alt="sticker" onerror="this.style.display='none'">
                
                <div class="booth bg-blue">
                    <div class="inner-pad">
                        <!-- ช่องที่ 4 (รันรูป 4, 10, 16) -->
                        <div class="photo-slot" id="slot-4"></div>
                        <!-- ช่องที่ 5 (รันรูป 5, 11, 17) -->
                        <div class="photo-slot" id="slot-5"></div>
                        <!-- ช่องที่ 6 (รันรูป 6, 12, 18) -->
                        <div class="photo-slot" id="slot-6"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // ================= 1. ระบบ Photo Slideshow =================
            // กำหนดชุดรูปภาพสำหรับแต่ละช่อง
            // ชุด 1: 1-6 | ชุด 2: 7-12 | ชุด 3: 13-18
            const photoSets = [
                [1, 7, 13], // รูปสำหรับช่อง 1
                [2, 8, 14], // รูปสำหรับช่อง 2
                [3, 9, 15], // รูปสำหรับช่อง 3
                [4, 10, 16], // รูปสำหรับช่อง 4
                [5, 11, 17], // รูปสำหรับช่อง 5
                [6, 12, 18]  // รูปสำหรับช่อง 6
            ];

            // สร้าง Element รูปภาพใส่ลงในแต่ละ Slot
            photoSets.forEach((set, slotIndex) => {
                const slotId = `slot-${slotIndex + 1}`;
                const slotEl = document.getElementById(slotId);
                
                set.forEach((imgNumber, imgIndex) => {
                    const img = document.createElement('img');
                    img.src = `${imgNumber}.jpg`;
                    // ใส่สีพื้นหลังหลอกกรณีรูปยังไม่มา
                    img.style.backgroundColor = `hsl(${imgNumber * 20}, 70%, 90%)`; 
                    
                    // ให้รูปแรกของทุกช่องเป็น active
                    if (imgIndex === 0) {
                        img.classList.add('active');
                    }
                    
                    // ป้องกันรูปแตกเมื่อไม่ได้ใส่ไฟล์ไว้ (สำหรับพรีวิว)
                    img.onerror = function() {
                        this.src = `https://placehold.co/400x533/ffe3eb/9c7b82?text=Photo+${imgNumber}`;
                    };
                    
                    slotEl.appendChild(img);
                });
            });

            // Logic สลับรูปทุกๆ 6 วินาที
            let currentSetIndex = 0;
            const totalSets = 3;

            setInterval(() => {
                const nextSetIndex = (currentSetIndex + 1) % totalSets;

                // วนลูปทุกช่อง (6 ช่อง)
                for (let i = 1; i <= 6; i++) {
                    const slot = document.getElementById(`slot-${i}`);
                    const images = slot.querySelectorAll('img');
                    
                    // Fade out รูปปัจจุบัน
                    images[currentSetIndex].classList.remove('active');
                    // Fade in รูปถัดไป
                    images[nextSetIndex].classList.add('active');
                }

                currentSetIndex = nextSetIndex;
            }, 6000); // 6 วินาที


            // ================= 2. ระบบ Secret Paper Interaction =================
            const interactionZone = document.getElementById('interaction-zone');
            const secretPaper = document.getElementById('secret-paper');
            let isReading = false;
            let timeoutId = null;

            // เมื่อคลิกที่กระดาษ (หรือบริเวณพื้นที่กระดาษที่โผล่ออกมา)
            secretPaper.addEventListener('click', () => {
                if (isReading) return; // กันกดเบิ้ล

                isReading = true;
                interactionZone.classList.add('active');

                // เคลียร์ Timeout เก่าถ้ามี
                if (timeoutId) clearTimeout(timeoutId);

                // ค้างไว้ 8 วินาที แล้วกลับสภาพเดิม
                timeoutId = setTimeout(() => {
                    interactionZone.classList.remove('active');
                    isReading = false;
                }, 8000);
            });
        });
    </script>
</body>
</html>
